<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090f;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --accent:  #6366f1;
      --adim:    rgba(99,102,241,0.14);
      --text:    #dde3ed;
      --muted:   #5e6a7e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }
    .delivery-status { display:block; margin-top:7px; font-size:11px; color:var(--muted); }
    .msg-u[data-state="failed"] .delivery-status,
    .msg-u[data-state="unknown"] .delivery-status { color:#f87171; }
    .msg-u[data-state="delivered"] .delivery-status { color:var(--green); }
    .delivery-retry { margin-top:8px; padding:7px 10px; font-size:10px; }
    .btn:disabled { opacity:0.5; cursor:wait; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Send a command to JARVIS…" autocomplete="off" maxlength="20000">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button id="send-btn" class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    let _storageAccessFailed = false;
    function _sessionValue(key) {
      try { return sessionStorage.getItem(key); }
      catch (_) { _storageAccessFailed = true; return null; }
    }
    const _authToken  = _sessionValue('jarvis_token');
    const _sessionKey = _sessionValue('jarvis_key');

    if (!_authToken && !_storageAccessFailed) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to JARVIS'); };
    ws.onclose   = () => {
      _persistOutbox();
      sys('Conexão perdida. Atualize para reconectar; os envios pendentes serão recuperados nesta aba.');
    };
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Jarvis</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    let _lastCommand = null;
    let _sendingCommand = null;
    const _OUTBOX_KEY = 'chloe_command_outbox_v1';
    const _OUTBOX_LIMIT = 20;
    const _OUTBOX_RETENTION = 24 * 60 * 60;
    const _COMMAND_TEXT_LIMIT = 20000;
    const _deviceId = _sessionValue('jarvis_device_id');
    const _commandScope = _deviceId ? 'device:' + _deviceId
      : typeof CryptoJS !== 'undefined' && _authToken ? 'legacy:' + CryptoJS.SHA256(_authToken).toString() : null;
    let _commandRecords = [];
    let _draftUpdatedAt = Date.now() / 1000;
    let _scopeMismatch = false;
    let _outboxUnreadable = _storageAccessFailed;
    let _expiredHold = false;
    let _recoveryNotice = null;

    function _recoveryMessage(text, acknowledge = false) {
      if (!_recoveryNotice) {
        const card = document.createElement('div'); card.className = 'msg msg-sys';
        card.id = 'recovery-notice'; card.setAttribute('role', 'status');
        const message = document.createElement('div');
        const button = document.createElement('button'); button.className = 'btn delivery-retry';
        button.textContent = 'Conferi os envios anteriores; liberar esta sessão';
        button.addEventListener('click', _acknowledgeRecovery);
        card.appendChild(message); card.appendChild(button); feed.appendChild(card);
        _recoveryNotice = { message, button };
      }
      _recoveryNotice.message.textContent = text;
      _recoveryNotice.button.hidden = !acknowledge;
    }

    function _recoveryBlocked() {
      if (_scopeMismatch) {
        _recoveryMessage('Há envios de outro dispositivo ou sessão. Reconecte o dispositivo original para consultar. Antes de limpar a recuperação, confira se as ações anteriores foram executadas.', true);
      } else if (_outboxUnreadable || !_commandScope) {
        _recoveryMessage('Não foi possível ler a recuperação desta aba. Confira os envios anteriores antes de limpar a recuperação ou reconecte o dispositivo.', Boolean(_commandScope));
      } else if (_expiredHold) {
        _recoveryMessage('A recuperação de envios anteriores expirou após 24 horas. Confira as ações já executadas antes de liberar novos comandos.', true);
      } else { return false; }
      return true;
    }

    function _persistOutbox() {
      if (_scopeMismatch || _outboxUnreadable || !_commandScope) return false;
      const now = Date.now() / 1000;
      const input = document.getElementById('inp');
      if (input.value.length > _COMMAND_TEXT_LIMIT) {
        _recoveryMessage('O rascunho ultrapassa 20.000 caracteres. Reduza o texto antes de enviar; o conteúdo permanece no campo.');
        return false;
      }
      const commands = [];
      for (const command of _commandRecords) {
        if (command.status === 'delivered') continue;
        if (now - command.createdAt > _OUTBOX_RETENTION) {
          _expiredHold = true;
          continue;
        }
        commands.push({ id: command.id, createdAt: command.createdAt, text: command.text, status: command.status });
      }
      const draftExpired = now - _draftUpdatedAt > _OUTBOX_RETENTION;
      if (draftExpired && input.value) _expiredHold = true;
      try {
        // sessionStorage is local to this browser tab. No conversation content
        // is logged, sent elsewhere or retained after successful delivery.
        sessionStorage.setItem(_OUTBOX_KEY, JSON.stringify({
          version: 1, scope: _commandScope, commands, expiredHold: _expiredHold,
          draft: draftExpired ? '' : input.value, draftUpdatedAt: _draftUpdatedAt,
        }));
        if (_expiredHold) _recoveryBlocked();
        return true;
      } catch (_) {
        _recoveryMessage('Não foi possível salvar a recuperação nesta aba. Seu rascunho continua aqui; mantenha a aba aberta e tente novamente. Nenhum novo envio será iniciado sem salvar sua identificação.');
        return false;
      }
    }

    function _restoreOutbox() {
      if (_storageAccessFailed) { _recoveryBlocked(); return; }
      let saved;
      try {
        const raw = sessionStorage.getItem(_OUTBOX_KEY);
        if (!raw) return;
        if (raw.length > 500000) throw new Error();
        saved = JSON.parse(raw);
        if (saved.version !== 1 || typeof saved.scope !== 'string' || !Array.isArray(saved.commands)
            || saved.scope.length > 256
            || saved.commands.length > _OUTBOX_LIMIT || typeof saved.draft !== 'string'
            || saved.draft.length > _COMMAND_TEXT_LIMIT || !Number.isFinite(saved.draftUpdatedAt)
            || saved.draftUpdatedAt > Date.now() / 1000 + 60) throw new Error();
        const ids = new Set();
        for (const command of saved.commands) {
          if (typeof command.id !== 'string' || !/^[A-Za-z0-9_-]{1,128}$/.test(command.id)
              || ids.has(command.id) || !Number.isFinite(command.createdAt)
              || command.createdAt <= 0 || command.createdAt > Date.now() / 1000 + 60
              || typeof command.text !== 'string' || !command.text.trim()
              || command.text.length > _COMMAND_TEXT_LIMIT
              || !['pending', 'failed', 'unknown'].includes(command.status)) throw new Error();
          ids.add(command.id);
        }
      } catch (_) {
        _outboxUnreadable = true; _recoveryBlocked(); return;
      }
      const now = Date.now() / 1000;
      _scopeMismatch = saved.scope !== _commandScope;
      _expiredHold = saved.expiredHold === true;
      if (now - saved.draftUpdatedAt <= _OUTBOX_RETENTION) {
        document.getElementById('inp').value = saved.draft;
        _draftUpdatedAt = saved.draftUpdatedAt;
      } else if (saved.draft) { _expiredHold = true; }
      for (const record of saved.commands) {
        if (now - record.createdAt > _OUTBOX_RETENTION) { _expiredHold = true; continue; }
        // Navigation interrupted a pending transport. Only a server status
        // query with the original identity can resolve that uncertainty.
        if (record.status === 'pending') record.status = 'unknown';
        _lastCommand = _commandCard(record.text, record);
      }
      _recoveryBlocked();
      if (!_scopeMismatch) _persistOutbox();
      else if (_expiredHold) {
        // Expired contents are removed even when a different device is signed
        // in, while retaining the old scope and the explicit safety barrier.
        try {
          sessionStorage.setItem(_OUTBOX_KEY, JSON.stringify({
            version: 1, scope: saved.scope, expiredHold: true,
            commands: saved.commands.filter(command => now - command.createdAt <= _OUTBOX_RETENTION),
            draft: now - saved.draftUpdatedAt <= _OUTBOX_RETENTION ? saved.draft : '',
            draftUpdatedAt: saved.draftUpdatedAt,
          }));
        } catch (_) { _recoveryMessage('Não foi possível atualizar a recuperação expirada. Mantenha esta aba aberta e confira os envios anteriores.', true); }
      }
    }

    function _acknowledgeRecovery() {
      const previous = { records: _commandRecords, mismatch: _scopeMismatch,
        unreadable: _outboxUnreadable, expired: _expiredHold, last: _lastCommand };
      const now = Date.now() / 1000;
      _commandRecords = _scopeMismatch || _outboxUnreadable ? []
        : _commandRecords.filter(command => now - command.createdAt <= _OUTBOX_RETENTION);
      _scopeMismatch = _outboxUnreadable = _expiredHold = false;
      _lastCommand = _commandRecords.at(-1) || null;
      _draftUpdatedAt = now;
      if (!_persistOutbox()) {
        _commandRecords = previous.records; _scopeMismatch = previous.mismatch;
        _outboxUnreadable = previous.unreadable; _expiredHold = previous.expired; _lastCommand = previous.last;
        return;
      }
      for (const command of previous.records) {
        if (!_commandRecords.includes(command)) command.retry.hidden = true;
      }
      _recoveryMessage('Recuperação liberada após sua conferência. Os envios antigos não foram executados novamente.');
    }

    function _newCommandId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
    }

    function _renderCommand(command) {
      command.card.dataset.state = command.status;
      command.label.textContent = {
        pending: 'Enviando — aguardando confirmação da CHLOE…',
        delivered: 'Entregue à CHLOE',
        failed: command.error || 'Não foi possível entregar. Seu texto foi preservado.',
        unknown: 'Entrega não confirmada. Consulte o envio antes de repetir o comando.',
      }[command.status];
      command.retry.hidden = command.status === 'pending' || command.status === 'delivered';
      command.retry.textContent = command.status === 'unknown' ? 'Consultar envio' : 'Tentar novamente';
    }

    function _commandCard(text, restored = null) {
      const command = restored || { id: _newCommandId(), createdAt: Date.now() / 1000, text, status: 'pending' };
      const card = document.createElement('div');
      card.className = 'msg msg-u'; card.dataset.commandId = command.id;
      const title = document.createElement('div'); title.className = 'lbl'; title.textContent = 'Você';
      const content = document.createElement('div'); content.textContent = text;
      const label = document.createElement('span'); label.className = 'delivery-status';
      label.setAttribute('role', 'status'); label.setAttribute('aria-live', 'polite');
      const retry = document.createElement('button');
      retry.className = 'btn btn-send delivery-retry';
      retry.addEventListener('click', () => _sendCommand(command));
      card.appendChild(title); card.appendChild(content); card.appendChild(label); card.appendChild(retry);
      Object.assign(command, { card, label, retry });
      _commandRecords.push(command);
      _renderCommand(command); feed.appendChild(card); feed.scrollTop = feed.scrollHeight;
      return command;
    }

    async function _sendCommand(command) {
      if (_sendingCommand || command.status === 'delivered') return;
      if (_recoveryBlocked()) return;
      if (!_commandRecords.includes(command)) return;
      _sendingCommand = command;
      command.status = 'pending'; command.error = '';
      if (!_persistOutbox() || _recoveryBlocked()) {
        command.status = 'failed';
        command.error = 'Envio não iniciado: não foi possível salvar a recuperação. Seu texto permanece nesta aba.';
        _renderCommand(command); _sendingCommand = null;
        return;
      }
      _renderCommand(command);
      document.getElementById('send-btn').disabled = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const encrypted = _encrypt(command.text);
        const body = { id: command.id, created_at: command.createdAt };
        Object.assign(body, encrypted ? { enc: encrypted } : { text: command.text });
        const response = await _authFetch('/api/command', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body), signal: controller.signal,
        });
        let result;
        try { result = await response.json(); } catch (_) { result = null; }
        if (response.ok && result?.id === command.id && result.status === 'delivered' && result.ok === true) {
          command.status = 'delivered';
          const input = document.getElementById('inp');
          if (input.value.trim() === command.text) { input.value = ''; _draftUpdatedAt = Date.now() / 1000; }
        } else if (response.status === 401) {
          command.status = 'failed';
          command.error = 'Sessão expirada ou revogada. Reconecte o dispositivo; seu texto foi preservado.';
          if (!document.getElementById('reconnect-device')) {
            const reconnect = document.createElement('a');
            reconnect.id = 'reconnect-device'; reconnect.href = '/login';
            reconnect.className = 'delivery-retry';
            reconnect.textContent = 'Reconectar dispositivo';
            feed.appendChild(reconnect);
          }
        } else if (result?.status === 'unknown' || result?.status === 'pending' || response.ok) {
          command.status = 'unknown';
        } else {
          command.status = 'failed';
          command.error = 'Não foi possível entregar. Verifique a conexão e tente novamente; seu texto foi preservado.';
        }
      } catch (_) {
        // A lost response does not prove the command was not executed. Retry
        // always reuses this ID and timestamp so the server can deduplicate it.
        command.status = 'unknown';
      } finally {
        clearTimeout(timeout);
        _renderCommand(command);
        _sendingCommand = null;
        document.getElementById('send-btn').disabled = false;
        _commandRecords = _commandRecords.filter(record => record.status !== 'delivered');
        _persistOutbox();
      }
    }

    async function doSend() {
      const text = document.getElementById('inp').value.trim();
      if (!text || _sendingCommand) return;
      if (_recoveryBlocked()) return;
      if (text.length > _COMMAND_TEXT_LIMIT) {
        _recoveryMessage('A mensagem ultrapassa 20.000 caracteres. Reduza o texto antes de enviar.'); return;
      }
      try {
        // A repeated click/Enter after failure queries or retries the same
        // attempt. Editing the draft intentionally creates a different command.
        _lastCommand = _commandRecords.find(command => command.text === text) || null;
        if (!_lastCommand && _commandRecords.length >= _OUTBOX_LIMIT) {
          _recoveryMessage('Há 20 envios sem confirmação nesta aba. Consulte ou conclua os envios anteriores antes de iniciar outro.'); return;
        }
        if (!_lastCommand)
          _lastCommand = _commandCard(text);
        await _sendCommand(_lastCommand);
      } catch (_) {
        sys('Não foi possível preparar o envio. Seu texto foi preservado.');
      }
    }

    async function doWake() {
      try {
        const response = await _authFetch('/api/wake', { method: 'POST' });
        sys(response.ok ? 'Solicitação de despertar enviada.' : 'Não foi possível despertar. Reconecte o dispositivo.');
      } catch (_) { sys('Sem conexão para despertar. Tente novamente.'); }
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });
    document.getElementById('inp').addEventListener('input', () => {
      _draftUpdatedAt = Date.now() / 1000;
      _persistOutbox();
    });
    window.addEventListener('pagehide', _persistOutbox);
    _restoreOutbox();

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceSession = null;

    function _setVoiceState(state) {
      micBtn.dataset.state = state;
      micBtn.disabled = state === 'stopping';
      micBtn.classList.toggle('recording', state === 'recording');
      micBtn.setAttribute('aria-pressed', String(state === 'recording'));
      micBtn.innerHTML = state === 'starting' || state === 'recording' ? '⏹' : state === 'stopping' ? '…' : '🎤';
      micBtn.title = {
        idle: 'Microfone — toque para falar',
        starting: 'Cancelar inicialização do microfone',
        recording: 'Parar microfone',
        stopping: 'Cancelando microfone — aguardando a permissão pendente',
        error: 'Falha no microfone — toque para tentar novamente',
      }[state];
    }

    function _voiceCurrent(session) {
      return _voiceSession === session && !session.cancelled;
    }

    // Each attempt owns its resources. A late callback can only close its own
    // attempt; it must never affect a newer microphone session.
    function _releaseVoice(session) {
      clearTimeout(session.timeout);
      session.timeout = null;
      for (const node of session.nodes.splice(0)) {
        if (node.port) node.port.onmessage = null;
        node.onaudioprocess = null;
        try { node.disconnect(); } catch (_) {}
      }
      if (session.stream) {
        for (const track of session.stream.getTracks()) {
          track.onended = null;
          try { track.stop(); } catch (_) {}
        }
        session.stream = null;
      }
      if (session.socket) {
        const socket = session.socket;
        session.socket = null;
        socket.onopen = socket.onclose = socket.onerror = null;
        if (socket.readyState < 2) { try { socket.close(); } catch (_) {} }
      }
      if (session.context) {
        const context = session.context;
        session.context = null;
        try { Promise.resolve(context.close()).catch(() => {}); } catch (_) {}
      }
      if (session.blobUrl) {
        URL.revokeObjectURL(session.blobUrl);
        session.blobUrl = null;
      }
    }

    function _stopVoice(session = _voiceSession, finalState = 'idle') {
      if (!session) return;
      session.cancelled = true;
      session.finalState = finalState;
      _releaseVoice(session);
      if (_voiceSession !== session) return;
      // getUserMedia cannot be aborted. Keep a cancelled attempt registered
      // until it settles, preventing another concurrent permission request.
      if (session.permissionPending) {
        _setVoiceState('stopping');
      } else {
        _voiceSession = null;
        _setVoiceState(finalState);
      }
    }

    _setVoiceState('idle');
    window.addEventListener('pagehide', () => _stopVoice());

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.textContent = 'O navegador não disponibilizou o microfone. Abra o painel por HTTPS com um certificado confiável e permita o acesso ao microfone nas configurações do site. A conversa por texto continua disponível.';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
    }

    async function doMic() {
      if (_voiceSession) { _stopVoice(); return; }
      if (!navigator.mediaDevices?.getUserMedia) {
        _setVoiceState('error');
        _showVoiceSetup();
        return;
      }
      const session = {
        cancelled: false, permissionPending: true, stream: null,
        context: null, socket: null, nodes: [], blobUrl: null, timeout: null,
      };
      _voiceSession = session;
      _setVoiceState('starting');
      try {
        session.stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
        session.permissionPending = false;
        if (!_voiceCurrent(session)) { _stopVoice(session, session.finalState); return; }
        for (const track of session.stream.getTracks()) {
          track.onended = () => {
            if (_voiceCurrent(session)) {
              sys('O microfone foi desconectado. Conecte-o novamente e tente outra vez.');
              _stopVoice(session, 'error');
            }
          };
        }

        // Keep the existing PCM16 transport and native-rate fallback.
        let ctx;
        try { ctx = new AudioContext({ sampleRate: 16000 }); }
        catch (_) { ctx = new AudioContext(); }
        session.context = ctx;
        if (ctx.state === 'suspended') await ctx.resume();
        if (!_voiceCurrent(session)) { _releaseVoice(session); return; }
        const socket = new WebSocket(
          `${_wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
        );
        session.socket = socket;
        socket.binaryType = 'arraybuffer';
        session.timeout = setTimeout(() => {
          if (_voiceCurrent(session)) {
            sys('Não foi possível iniciar a voz a tempo. Tente novamente.');
            _stopVoice(session, 'error');
          }
        }, 10000);

        socket.onopen = async () => {
          if (!_voiceCurrent(session)) { _releaseVoice(session); return; }
          try {
            const rate = ctx.sampleRate;
            const src = ctx.createMediaStreamSource(session.stream);
            session.nodes.push(src);
            const code = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
            try {
              const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
              session.blobUrl = url;
              try { await ctx.audioWorklet.addModule(url); }
              finally {
                if (session.blobUrl === url) {
                  URL.revokeObjectURL(url); session.blobUrl = null;
                }
              }
              if (!_voiceCurrent(session)) { _releaseVoice(session); return; }
              const node = new AudioWorkletNode(ctx, 'j');
              session.nodes.push(node);
              let chunks = [], length = 0;
              node.port.onmessage = e => {
                if (!_voiceCurrent(session) || socket.readyState !== 1) return;
                const chunk = new Int16Array(_f32toPcm16(e.data, rate));
                chunks.push(chunk); length += chunk.length;
                if (length >= 1024) {
                  const out = new Int16Array(length); let offset = 0;
                  for (const part of chunks) { out.set(part, offset); offset += part.length; }
                  socket.send(out.buffer); chunks = []; length = 0;
                }
              };
              src.connect(node); node.connect(ctx.destination);
            } catch (_) {
              if (!_voiceCurrent(session)) { _releaseVoice(session); return; }
              const node = ctx.createScriptProcessor(4096, 1, 1);
              session.nodes.push(node);
              node.onaudioprocess = e => {
                if (_voiceCurrent(session) && socket.readyState === 1)
                  socket.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
              };
              src.connect(node); node.connect(ctx.destination);
            }
            if (!_voiceCurrent(session)) { _releaseVoice(session); return; }
            clearTimeout(session.timeout); session.timeout = null;
            _setVoiceState('recording');
            sys('Microfone ativo — toque em parar para encerrar.');
          } catch (_) {
            if (_voiceCurrent(session)) {
              sys('Não foi possível processar o áudio. Verifique o dispositivo e tente novamente.');
              _stopVoice(session, 'error');
            } else { _releaseVoice(session); }
          }
        };
        socket.onclose = () => {
          if (_voiceCurrent(session)) sys('A conexão de voz foi encerrada. O microfone foi desligado.');
          _stopVoice(session);
        };
        socket.onerror = () => {
          if (_voiceCurrent(session)) sys('Falha na conexão de voz. O microfone foi desligado.');
          _stopVoice(session, 'error');
        };
      } catch (error) {
        session.permissionPending = false;
        if (_voiceCurrent(session)) {
          sys(error.name === 'NotAllowedError'
            ? 'Permissão de microfone negada. Permita o acesso nas configurações do site e tente novamente.'
            : 'Não foi possível iniciar o microfone. Verifique o dispositivo e tente novamente.');
          _stopVoice(session, 'error');
        } else { _stopVoice(session, session.finalState); }
      }
    }
  </script>
</body>
